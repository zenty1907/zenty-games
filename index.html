
<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Zenty City</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#111923;color:white;font:14px Arial,sans-serif;touch-action:none}
#game{position:fixed;inset:0}
canvas{display:block}
button{border:1px solid #ffffff50;border-radius:12px;padding:12px;background:#101c2ddd;color:white;font-weight:bold;touch-action:none;user-select:none;-webkit-user-select:none}
button:active{background:#287c83;transform:scale(.96)}
#hud{position:fixed;inset:10px 10px auto;display:flex;justify-content:space-between;gap:8px;pointer-events:none}
.panel{background:#101923dc;border:1px solid #ffffff30;border-radius:12px;padding:10px}
#brand{font-weight:900;letter-spacing:2px}#brand span{color:#65f4d3}
#stats{display:flex;gap:5px;font-size:12px;font-weight:bold}
#mission{position:fixed;top:64px;left:10px;max-width:260px;background:#101923dd;border-radius:10px;padding:10px;font-size:12px}
#mission b{color:#65f4d3;display:block;margin-bottom:4px}
#map{position:fixed;right:10px;top:115px;width:100px;height:100px;background:#0c1722e8;border:1px solid #ffffff50;border-radius:12px}
#controls{position:fixed;bottom:12px;left:10px;right:10px;display:flex;justify-content:space-between;align-items:end;pointer-events:none}
#controls>div{pointer-events:auto}
#pad{display:grid;grid-template-columns:48px 48px 48px;grid-template-rows:45px 45px;gap:4px}
#pad button{padding:0;font-size:20px}
#up{grid-column:2}#left{grid-column:1;grid-row:2}#down{grid-column:2;grid-row:2}#right{grid-column:3;grid-row:2}
#actions{display:flex;flex-wrap:wrap;justify-content:flex-end;gap:5px;max-width:65%}
#actions button{font-size:10px;padding:10px 8px;min-width:53px}
#hint{position:fixed;bottom:120px;left:50%;transform:translateX(-50%);white-space:nowrap;background:#101923c9;border-radius:20px;padding:8px 12px;font-size:11px;pointer-events:none}
#crosshair{position:fixed;left:50%;top:50%;width:5px;height:5px;border-radius:50%;background:white;display:none;pointer-events:none}
#overlay{position:fixed;inset:0;z-index:10;display:flex;align-items:center;justify-content:center;padding:20px;background:linear-gradient(140deg,#08111cf2,#132d3ceF)}
#intro{max-width:480px;width:100%;background:#101923;border:1px solid #ffffff30;border-radius:22px;padding:25px;box-shadow:0 20px 80px #0009}
h1{font-size:48px;line-height:.95;margin:0 0 12px;letter-spacing:-2px}h1 span{color:#65f4d3}
#intro p{line-height:1.5;color:#c9d7df}
#start{width:100%;padding:16px;background:linear-gradient(100deg,#65f4d3,#a8f2bd);color:#081b20;border:0;font-size:16px;margin-top:12px}
#status{font-size:12px;color:#ffcc88;min-height:16px}
@media(min-width:800px){#controls{display:none}#hint{bottom:15px}}
@media(max-width:500px){h1{font-size:40px}#stats{font-size:10px}#stats .panel{padding:8px 6px}#map{width:84px;height:84px;top:112px}#actions{max-width:62%}#actions button{min-width:45px;padding:9px 5px;font-size:9px}#pad{grid-template-columns:43px 43px 43px;grid-template-rows:42px 42px}}
</style>
</head>
<body>
<div id="game"></div>
<div id="hud">
  <div class="panel" id="brand"><span>ZENTY</span> CITY</div>
  <div id="stats">
    <div class="panel" id="cash">$250</div>
    <div class="panel" id="speed">YAYA</div>
    <div class="panel" id="stars">☆ ☆ ☆ ☆ ☆</div>
  </div>
</div>
<div id="mission"><b>ŞEHİR GÖREVİ</b><span id="missionText">Mavi halkaya ulaş!</span></div>
<canvas id="map" width="200" height="200"></canvas>
<div id="crosshair"></div>
<div id="hint">WASD: hareket · E: araca bin/in · C: kamera</div>

<div id="controls">
  <div id="pad">
    <button id="up" data-key="w">▲</button>
    <button id="left" data-key="a">◀</button>
    <button id="down" data-key="s">▼</button>
    <button id="right" data-key="d">▶</button>
  </div>
  <div id="actions">
    <button data-key="shift">KOŞ/NİTRO</button>
    <button id="cameraBtn">KAMERA</button>
    <button id="enterBtn">E · BİN/İN</button>
    <button id="brakeBtn" data-key="space">FREN</button>
    <button id="lightsBtn">FARLAR</button>
    <button id="hornBtn">KORNA</button>
    <button id="timeBtn">GECE/GÜNDÜZ</button>
  </div>
</div>

<div id="overlay">
  <div id="intro">
    <h1><span>ZENTY</span><br>CITY</h1>
    <p>Büyük şehre hoş geldin! Sokakları keşfet, araba kullan, para topla ve görevleri tamamla.</p>
    <p>🏙️ 3D şehir · 🚘 Sürüş · 🎥 Birinci/üçüncü şahıs kamera · 🌙 Gece modu · 📱 Mobil kontroller</p>
    <div id="status"></div>
    <button id="start">ŞEHRE GİR</button>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
(()=>{
"use strict";
const $=id=>document.getElementById(id);
const host=$("game");
const keys=Object.create(null);
let scene,renderer,camera,clock,player,car;
let started=false,loading=false,inCar=false;
let yaw=0,pitch=.08,carYaw=0,carSpeed=0,camMode=0;
let money=250,wanted=0,missionIndex=0,night=false,lights=false;
let hemi,sun,missionRings=[],coins=[],traffic=[],buildings=[];
const CITY=220,STEP=32,ROAD=11;
const rnd=n=>{let x=Math.sin(n*127.1+311.7)*43758.5453;return x-Math.floor(x)};
const mat=(c,r=.85,m=0)=>new THREE.MeshStandardMaterial({color:c,roughness:r,metalness:m});
function box(parent,x,y,z,w,h,d,m){
 const o=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),m);
 o.position.set(x,y,z);parent.add(o);return o;
}
function blocked(x,z,r=.6){
 if(Math.abs(x)>CITY-5||Math.abs(z)>CITY-5)return true;
 for(const b of buildings)
  if(Math.abs(x-b.x)<b.w/2+r&&Math.abs(z-b.z)<b.d/2+r)return true;
 return false;
}
function building(x,z,w,d,h,n){
 const g=new THREE.Group();g.position.set(x,0,z);scene.add(g);
 const colors=[0x929da4,0xbab9ae,0x647987,0xc7bba8,0x53616c,0xd0d2ce,0x8b9d9e];
 box(g,0,h/2,0,w,h,d,mat(colors[Math.floor(rnd(n)*colors.length)]));
 // Repeated window panels keep the city reasonably light for phones.
 const tex=document.createElement("canvas");tex.width=128;tex.height=256;
 const cx=tex.getContext("2d");cx.fillStyle="#263d4a";cx.fillRect(0,0,128,256);
 for(let yy=5;yy<250;yy+=25)for(let xx=5;xx<125;xx+=21){
   cx.fillStyle=rnd(n+yy+xx)>.68?"#e9c98a":"#527184";
   cx.fillRect(xx,yy,12,16);
 }
 const texture=new THREE.CanvasTexture(tex);
 const wm=new THREE.MeshBasicMaterial({map:texture,side:THREE.DoubleSide});
 const fh=Math.max(4,h-2);
 for(const side of [-1,1]){
   const f=new THREE.Mesh(new THREE.PlaneGeometry(w*.95,fh),wm);
   f.position.set(0,h/2,side*(d/2+.02));g.add(f);
   const s=new THREE.Mesh(new THREE.PlaneGeometry(d*.95,fh),wm);
   s.rotation.y=side*Math.PI/2;s.position.set(side*(w/2+.02),h/2,0);g.add(s);
 }
 if(rnd(n+7)>.5)box(g,0,h+.3,0,w*.22,.6,d*.22,mat(0x5c6870));
 buildings.push({x,z,w:w*.95,d:d*.95});
}
function tree(x,z){
 const g=new THREE.Group();g.position.set(x,0,z);scene.add(g);
 const trunk=new THREE.Mesh(new THREE.CylinderGeometry(.13,.2,2,7),mat(0x654b37));
 trunk.position.y=1;g.add(trunk);
 for(let i=0;i<3;i++){
  const crown=new THREE.Mesh(new THREE.IcosahedronGeometry(.9,1),mat(i===1?0x377b50:0x286544));
  crown.position.set((i-1)*.25,2+i*.4,0);g.add(crown);
 }
}
function makeCar(color=0x167d8c){
 const g=new THREE.Group();
 const paint=mat(color,.3,.4),glass=mat(0x18313d,.22,.18);
 box(g,0,.6,0,1.9,.55,4,paint);
 box(g,0,1,-.15,1.55,.65,2.05,glass);
 box(g,0,.92,1.22,1.65,.15,.5,paint);
 const lamps=[];
 for(const x of [-.52,.52]){
  lamps.push(box(g,x,.64,2.02,.35,.14,.06,mat(0xffedc2,.3)));
  box(g,x,.64,-2.02,.3,.14,.06,mat(0xc52b32));
 }
 for(const x of [-1,1])for(const z of [-1.3,1.3]){
  const w=new THREE.Mesh(new THREE.CylinderGeometry(.36,.36,.23,14),mat(0x111519));
  w.rotation.z=Math.PI/2;w.position.set(x,.35,z);g.add(w);
  const hub=new THREE.Mesh(new THREE.CylinderGeometry(.16,.16,.24,10),mat(0x9ba8ae,.3,.7));
  hub.rotation.z=Math.PI/2;hub.position.set(x*1.01,.35,z);g.add(hub);
 }
 // dashboard + steering wheel
 box(g,0,1.02,.55,1.45,.18,.48,mat(0x20282c));
 const wheel=new THREE.Mesh(new THREE.TorusGeometry(.19,.03,6,16),mat(0x101416));
 wheel.position.set(-.43,1.12,.52);g.add(wheel);
 g.userData.lamps=lamps;
 return g;
}
function makePerson(){
 const g=new THREE.Group();
 box(g,0,1.15,0,.5,.7,.3,mat(0x29495c));
 box(g,-.16,.53,0,.18,.55,.2,mat(0x202731));
 box(g,.16,.53,0,.18,.55,.2,mat(0x202731));
 const head=new THREE.Mesh(new THREE.SphereGeometry(.19,12,10),mat(0xc99170));
 head.position.y=1.7;g.add(head);
 return g;
}
function mission(x,z){
 const g=new THREE.Group();g.position.set(x,1.4,z);scene.add(g);
 const ring=new THREE.Mesh(new THREE.TorusGeometry(1.6,.12,8,24),mat(0x65f4d3,.3,.2));
 ring.rotation.x=Math.PI/2;g.add(ring);
 const beam=new THREE.Mesh(new THREE.CylinderGeometry(.04,.4,3.5,8,1,true),
  new THREE.MeshBasicMaterial({color:0x65f4d3,transparent:true,opacity:.18}));
 beam.position.y=-.2;g.add(beam);
 missionRings.push({g,x,z,done:false});
}
function trafficCar(i){
 const g=makeCar([0x9b3437,0xaaa99d,0x3c6654,0x303a48,0xbca05e][i%5]);
 g.scale.setScalar(.82);
 const horiz=i%2===0,lane=i%4<2?-2.2:2.2;
 const base=(Math.floor(i/2)%7-3)*STEP;
 if(horiz){g.position.set(base,0,lane);g.rotation.y=i%4<2?Math.PI/2:-Math.PI/2}
 else{g.position.set(lane,0,base);g.rotation.y=i%4<2?0:Math.PI}
 g.userData={horiz,lane,base,dir:i%4<2?1:-1,speed:4+rnd(i+90)*5};
 scene.add(g);traffic.push(g);
}
function buildCity(){
 scene.background=new THREE.Color(0x8ab9d5);
 scene.fog=new THREE.Fog(0x8ab9d5,110,360);
 hemi=new THREE.HemisphereLight(0xe4f5ff,0x4b5c47,2);scene.add(hemi);
 sun=new THREE.DirectionalLight(0xffe6c5,2.3);sun.position.set(-70,120,45);scene.add(sun);
 scene.add(new THREE.AmbientLight(0xffffff,.2));
 box(scene,0,-.6,0,CITY*2,1,CITY*2,mat(0x667d62));
 const asphalt=mat(0x30373d),side=mat(0xb4b5ac),paint=mat(0xe0d9b8);
 for(let p=-CITY;p<=CITY;p+=STEP){
  box(scene,p,.02,0,ROAD,.05,CITY*2,asphalt);
  box(scene,0,.02,p,CITY*2,.05,ROAD,asphalt);
  for(const off of [-7.4,7.4]){
   box(scene,p,.07,off,.8,.12,CITY*2,side);
   box(scene,off,.07,p,CITY*2,.12,.8,side);
  }
  for(let q=-CITY;q<CITY;q+=15){
   box(scene,p,.055,q,.1,.02,3.1,paint);
   box(scene,q,.055,p,3.1,.02,.1,paint);
  }
 }
 let n=1;
 for(let x=-CITY+STEP/2;x<CITY;x+=STEP){
  for(let z=-CITY+STEP/2;z<CITY;z+=STEP){
   const w=STEP-16-rnd(n)*2,d=STEP-16-rnd(n+3)*2;
   const h=9+Math.pow(rnd(n+2),.55)*38;
   building(x+(rnd(n+4)-.5)*2,z+(rnd(n+5)-.5)*2,w,d,h,n++);
   if(rnd(n+10)>.73)tree(x+10,z-9);
  }
 }
 for(let i=0;i<12;i++){
  const a=i*Math.PI/6,r=65+rnd(i+300)*25;
  building(Math.cos(a)*r,Math.sin(a)*r,12,12,48+rnd(i+20)*42,700+i);
 }
 for(let i=0;i<12;i++){
  const x=(rnd(i+600)-.5)*CITY*1.7,z=(rnd(i+700)-.5)*CITY*1.7;
  if(Math.abs(x%STEP)<8||Math.abs(z%STEP)<8)continue;
  const c=new THREE.Mesh(new THREE.TorusGeometry(.4,.1,6,12),mat(0xffd45c,.3,.3));
  c.position.set(x,1.2,z);c.rotation.x=Math.PI/2;scene.add(c);coins.push({x,z,mesh:c,taken:false});
 }
 for(let i=0;i<10;i++)trafficCar(i);
 mission(0,-64);mission(96,32);mission(-128,96);
}
function init(){
 if(!window.THREE)throw Error("3D motoru yüklenemedi. İnternet bağlantını kontrol et.");
 scene=new THREE.Scene();
 renderer=new THREE.WebGLRenderer({antialias:true,powerPreference:"high-performance"});
 renderer.setPixelRatio(Math.min(devicePixelRatio||1,1.4));
 renderer.setSize(innerWidth,innerHeight);
 renderer.outputEncoding=THREE.sRGBEncoding;
 if(THREE.ACESFilmicToneMapping!==undefined){
  renderer.toneMapping=THREE.ACESFilmicToneMapping;
  renderer.toneMappingExposure=1.1;
 }
 host.appendChild(renderer.domElement);
 camera=new THREE.PerspectiveCamera(72,innerWidth/innerHeight,.1,600);
 clock=new THREE.Clock();
 buildCity();
 player=makePerson();player.position.set(0,0,9);scene.add(player);
 car=makeCar();car.position.set(0,0,2);scene.add(car);
 window.addEventListener("resize",resize);
}
function resize(){
 if(!renderer)return;
 renderer.setSize(innerWidth,innerHeight);
 camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();
}
function moveFoot(dt){
 const f=(keys.w||keys.arrowup?1:0)-(keys.s||keys.arrowdown?1:0);
 const s=(keys.d||keys.arrowright?1:0)-(keys.a||keys.arrowleft?1:0);
 if(!f&&!s)return;
 const speed=keys.shift?8:4.5;
 const dx=(Math.sin(yaw)*f+Math.cos(yaw)*s)*speed*dt;
 const dz=(Math.cos(yaw)*f-Math.sin(yaw)*s)*speed*dt;
 const nx=player.position.x+dx,nz=player.position.z+dz;
 if(!blocked(nx,player.position.z,.35))player.position.x=nx;
 if(!blocked(player.position.x,nz,.35))player.position.z=nz;
 player.rotation.y=Math.atan2(dx,dz);
}
function drive(dt){
 const f=(keys.w||keys.arrowup?1:0)-(keys.s||keys.arrowdown?1:0);
 const s=(keys.d||keys.arrowright?1:0)-(keys.a||keys.arrowleft?1:0);
 carSpeed+=f*(f>0?15:20)*dt;
 carSpeed*=Math.pow(f===0?.985:.998,dt*60);
 if(keys.space)carSpeed*=Math.pow(.85,dt*60);
 carSpeed=Math.max(-9,Math.min(keys.shift?32:23,carSpeed));
 carYaw+=s*dt*(.9+Math.min(Math.abs(carSpeed)/15,1.1))*(carSpeed<0?-1:1);
 const nx=car.position.x+Math.sin(carYaw)*carSpeed*dt;
 const nz=car.position.z+Math.cos(carYaw)*carSpeed*dt;
 if(!blocked(nx,nz,1.3)){car.position.x=nx;car.position.z=nz}
 else{carSpeed*= -.2;toast("Çarpışma!")}
 car.rotation.y=carYaw;
}
let toastTimer;
function toast(s){
 $("hint").textContent=s;
 clearTimeout(toastTimer);
 toastTimer=setTimeout(()=>$("hint").textContent=inCar?"W gaz · S fren · A/D direksiyon · E in":"WASD hareket · E araç · C kamera",1800);
}
function enterExit(){
 if(!started)return;
 if(!inCar){
  if(Math.hypot(player.position.x-car.position.x,player.position.z-car.position.z)>5){
   toast("Önce arabaya yaklaş!");return;
  }
  inCar=true;player.visible=false;carYaw=car.rotation.y;toast("Arabaya bindin!");
 }else{
  inCar=false;player.visible=true;
  player.position.set(car.position.x+Math.cos(carYaw)*2,0,car.position.z-Math.sin(carYaw)*2);
  toast("Arabadan indin.");
 }
}
function changeCamera(){
 camMode=(camMode+1)%3;
 toast(["Üçüncü şahıs","Birinci şahıs","Uzak kamera"][camMode]);
}
function toggleLights(){
 lights=!lights;
 car.userData.lamps.forEach(l=>{
  l.material=lights?new THREE.MeshStandardMaterial({color:0xfff0bd,emissive:0xffd878,emissiveIntensity:2}):mat(0xffedc2,.3);
 });
 toast(lights?"Farlar açıldı":"Farlar kapandı");
}
function toggleNight(){
 night=!night;
 scene.background.set(night?0x101a2c:0x8ab9d5);
 scene.fog.color.set(night?0x101a2c:0x8ab9d5);
 hemi.intensity=night?.55:2;
 sun.intensity=night?.18:2.3;
 renderer.toneMappingExposure=night?.8:1.1;
 toast(night?"Gece modu":"Gündüz modu");
}
function honk(){
 try{
  const AC=window.AudioContext||window.webkitAudioContext;
  if(AC){
   const ac=new AC(),o=ac.createOscillator(),g=ac.createGain();
   o.type="sawtooth";o.frequency.value=180;
   g.gain.value=.08;o.connect(g);g.connect(ac.destination);
   o.start();o.stop(ac.currentTime+.22);
   setTimeout(()=>ac.close(),400);
  }
 }catch(e){}
 toast("Korna!");
}
function drawMap(){
 const c=$("map"),ctx=c.getContext("2d"),w=c.width;
 ctx.clearRect(0,0,w,w);ctx.fillStyle="#172b33";ctx.fillRect(0,0,w,w);
 const pos=inCar?car.position:player.position,sc=.32;
 ctx.save();ctx.translate(w/2-pos.x*sc,w/2-pos.z*sc);
 ctx.strokeStyle="#8b9ba0";ctx.lineWidth=ROAD*sc;
 for(let p=-CITY;p<=CITY;p+=STEP){
  ctx.beginPath();ctx.moveTo(p*sc,-CITY*sc);ctx.lineTo(p*sc,CITY*sc);ctx.stroke();
  ctx.beginPath();ctx.moveTo(-CITY*sc,p*sc);ctx.lineTo(CITY*sc,p*sc);ctx.stroke();
 }
 ctx.fillStyle="#65f4d3";
 missionRings.forEach(m=>{if(!m.done){ctx.beginPath();ctx.arc(m.x*sc,m.z*sc,4,0,7);ctx.fill()}});
 ctx.fillStyle="#f2bd53";
 traffic.forEach(t=>ctx.fillRect(t.position.x*sc-2,t.position.z*sc-2,4,4));
 ctx.restore();
 ctx.fillStyle="white";ctx.beginPath();ctx.arc(w/2,w/2,5,0,7);ctx.fill();
}
function update(dt){
 if(inCar)drive(dt);else moveFoot(dt);
 const pos=inCar?car.position:player.position;
 traffic.forEach(t=>{
  const u=t.userData,step=u.speed*dt*u.dir;
  if(u.horiz)t.position.x+=step;else t.position.z+=step;
  if(Math.abs((u.horiz?t.position.x:t.position.z)-u.base)>CITY-20){
   if(u.horiz)t.position.x=u.base;else t.position.z=u.base;
  }
  if(inCar&&Math.hypot(car.position.x-t.position.x,car.position.z-t.position.z)<2.3){
   carSpeed*=.8;wanted=Math.min(5,wanted+1);
  }
 });
 missionRings.forEach(m=>m.g.rotation.y+=dt*.7);
 coins.forEach(c=>{
  if(c.taken)return;
  c.mesh.rotation.z+=dt*1.3;
  if(Math.hypot(pos.x-c.x,pos.z-c.z)<2){
   c.taken=true;c.mesh.visible=false;money+=25;toast("+$25 topladın!");
  }
 });
 const m=missionRings[missionIndex];
 if(m&&!m.done&&Math.hypot(pos.x-m.x,pos.z-m.z)<4){
  m.done=true;m.g.visible=false;money+=150;missionIndex++;
  $("missionText").textContent=missionIndex<missionRings.length?"Yeni hedef mini haritada işaretli":"Görevler tamamlandı! Şehri keşfet.";
  toast("Görev tamamlandı! +$150");
 }
 const target=new THREE.Vector3(pos.x,inCar?1.1:1.5,pos.z);
 let cp,look;
 if(camMode===1){
  if(inCar){
   cp=new THREE.Vector3(pos.x,1.42,pos.z);
   look=cp.clone().add(new THREE.Vector3(Math.sin(carYaw),-.03,Math.cos(carYaw)).multiplyScalar(18));
  }else{
   cp=new THREE.Vector3(pos.x,1.62,pos.z);
   look=cp.clone().add(new THREE.Vector3(Math.sin(yaw),-pitch,Math.cos(yaw)).multiplyScalar(20));
  }
 }else{
  const dist=camMode===2?12:(inCar?7:5.5);
  cp=new THREE.Vector3(pos.x-Math.sin(yaw)*dist,inCar?3:2.8,pos.z-Math.cos(yaw)*dist);
  look=target.clone().add(new THREE.Vector3(Math.sin(yaw)*2,0,Math.cos(yaw)*2));
 }
 camera.position.lerp(cp,.18);camera.lookAt(look);
 $("cash").textContent="$"+money;
 $("speed").textContent=inCar?Math.round(Math.abs(carSpeed)*3.6)+" KM/H":"YAYA";
 $("stars").textContent="★".repeat(wanted)+"☆".repeat(5-wanted);
 $("crosshair").style.display=camMode===1?"block":"none";
 drawMap();
}
function loop(){
 if(!started)return;
 const dt=Math.min(clock.getDelta(),.04);
 update(dt);renderer.render(scene,camera);
 requestAnimationFrame(loop);
}
function setKey(k,v){keys[k]=v}
document.addEventListener("keydown",e=>{
 const k=e.key.toLowerCase();
 if(["arrowup","arrowdown","arrowleft","arrowright"," "].includes(k))e.preventDefault();
 setKey(k===" "?"space":k,true);
 if(k==="e"&&!e.repeat)enterExit();
 if(k==="c"&&!e.repeat)changeCamera();
});
document.addEventListener("keyup",e=>setKey(e.key.toLowerCase()===" "?"space":e.key.toLowerCase(),false));
window.addEventListener("blur",()=>Object.keys(keys).forEach(k=>keys[k]=false));

// Robust mobile buttons: pointer events set keys, and releasing anywhere clears them.
document.querySelectorAll("[data-key]").forEach(b=>{
 const k=b.dataset.key;
 b.addEventListener("pointerdown",e=>{
  e.preventDefault();setKey(k,true);
  try{b.setPointerCapture(e.pointerId)}catch(_){}
 });
 ["pointerup","pointercancel","lostpointercapture"].forEach(ev=>
  b.addEventListener(ev,e=>{e.preventDefault();setKey(k,false)})
 );
});
window.addEventListener("pointerup",()=>{["w","a","s","d","shift","space"].forEach(k=>setKey(k,false))});
$("enterBtn").addEventListener("pointerdown",e=>{e.preventDefault();enterExit()});
$("cameraBtn").addEventListener("pointerdown",e=>{e.preventDefault();changeCamera()});
$("lightsBtn").addEventListener("pointerdown",e=>{e.preventDefault();toggleLights()});
$("timeBtn").addEventListener("pointerdown",e=>{e.preventDefault();if(started)toggleNight()});
$("hornBtn").addEventListener("pointerdown",e=>{e.preventDefault();honk()});

let dragging=false,lastX=0,lastY=0;
host.addEventListener("pointerdown",e=>{
 if(!started)return;
 dragging=true;lastX=e.clientX;lastY=e.clientY;
});
host.addEventListener("pointermove",e=>{
 if(!dragging||!started)return;
 yaw-=(e.clientX-lastX)*.006;
 pitch=Math.max(-.35,Math.min(.55,pitch+(e.clientY-lastY)*.003));
 lastX=e.clientX;lastY=e.clientY;
});
window.addEventListener("pointerup",()=>dragging=false);
window.addEventListener("pointercancel",()=>dragging=false);

function startGame(e){
 if(e)e.preventDefault();
 if(started||loading)return;
 loading=true;
 $("start").textContent="ŞEHİR YÜKLENİYOR…";
 $("status").textContent="3D şehir hazırlanıyor. Birkaç saniye sürebilir.";
 // Yield to browser so the loading message appears before heavy scene creation.
 setTimeout(()=>{
  try{
   init();started=true;
   $("overlay").style.display="none";
   loop();
  }catch(err){
   console.error(err);
   $("status").textContent="Oyun açılamadı: "+err.message+" Sayfayı yenile ve interneti kontrol et.";
   $("start").textContent="TEKRAR DENE";loading=false;
  }
 },60);
}
$("start").addEventListener("pointerdown",startGame);
$("start").addEventListener("click",startGame);
window.addEventListener("contextmenu",e=>e.preventDefault());
})();
</script>
</body>
